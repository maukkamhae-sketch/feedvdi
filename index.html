<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>VidFeed</title>
<style>
  :root {
    --bg: #000;
    --accent: #fe2c55;
    --text: #fff;
    --text-dim: #b3b3b3;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overscroll-behavior: none;
  }

  /* ---------- 3D loading screen ---------- */
  #loading3d {
    position: fixed; inset: 0; background: #000; z-index: 999;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
  }
  .cube-stage { perspective: 500px; width: 70px; height: 70px; }
  .cube {
    width: 70px; height: 70px; position: relative; transform-style: preserve-3d;
    animation: spin 2.2s infinite linear;
  }
  .cube div {
    position: absolute; width: 70px; height: 70px;
    background: rgba(254,44,85,.18); border: 1.5px solid var(--accent);
  }
  .face-front  { transform: translateZ(35px); }
  .face-back   { transform: rotateY(180deg) translateZ(35px); }
  .face-right  { transform: rotateY(90deg) translateZ(35px); }
  .face-left   { transform: rotateY(-90deg) translateZ(35px); }
  .face-top    { transform: rotateX(90deg) translateZ(35px); }
  .face-bottom { transform: rotateX(-90deg) translateZ(35px); }
  @keyframes spin {
    0%   { transform: rotateX(0deg) rotateY(0deg); }
    100% { transform: rotateX(360deg) rotateY(360deg); }
  }
  #loading3d p { color: var(--text-dim); font-size: 13px; letter-spacing: .5px; }

  /* ---------- Login screen ---------- */
  #login {
    height: 100dvh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; padding: 30px; text-align: center;
  }
  #login .logo { font-size: 44px; }
  #login h1 { margin: 0; font-size: 22px; }
  #login p { color: var(--text-dim); margin: 0; font-size: 14px; }
  #login input {
    width: 100%; max-width: 280px; padding: 14px 16px; border-radius: 24px; border: none;
    background: #1c1c1c; color: var(--text); font-size: 15px; outline: none; text-align: center;
  }
  #login button {
    width: 100%; max-width: 280px; padding: 14px; border-radius: 24px; border: none;
    background: var(--accent); color: #fff; font-weight: 700; font-size: 15px;
  }
  #loginError { color: #ff5c5c; font-size: 13px; min-height: 16px; }

  /* ---------- Banned screen ---------- */
  #banned {
    height: 100dvh; display: none; flex-direction: column; align-items: center; justify-content: center;
    gap: 12px; padding: 30px; text-align: center;
  }
  #banned .icon { font-size: 50px; }
  #banned h1 { margin: 0; font-size: 20px; }
  #banned p { color: var(--text-dim); font-size: 14px; margin: 0; max-width: 300px; }

  /* ---------- Feed ---------- */
  #app { display: none; height: 100dvh; }
  #feed { height: 100dvh; overflow-y: scroll; scroll-snap-type: y mandatory; }
  .item {
    height: 100dvh; scroll-snap-align: start; position: relative;
    display: flex; align-items: center; justify-content: center; background: #000;
  }
  .item video {
    max-height: 100%; max-width: 100%; width: 100%; height: 100%;
    object-fit: contain; background: #000;
  }
  .meta {
    position: absolute; bottom: 90px; left: 16px; right: 90px;
    text-shadow: 0 1px 4px rgba(0,0,0,.8);
  }
  .meta .author { font-weight: 700; margin-bottom: 4px; }
  .meta .title { font-size: 14px; color: var(--text-dim); }
  .status {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    color: var(--text-dim); font-size: 14px; text-align: center; width: 80%;
  }

  #topbar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 10;
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px; background: linear-gradient(rgba(0,0,0,.6), transparent);
  }
  #topbar .greet { font-weight: 700; font-size: 15px; }
  #topbar .topbtns { display: flex; gap: 8px; }
  #topbar button {
    background: rgba(255,255,255,.15); color: #fff; border: none; border-radius: 16px;
    padding: 6px 12px; font-size: 12px;
  }

  /* ---------- Modal Teman ---------- */
  #friendsOverlay {
    display: none; position: fixed; inset: 0; z-index: 50;
    background: rgba(0,0,0,.75); align-items: flex-end; justify-content: center;
  }
  #friendsPanel {
    background: #141414; width: 100%; max-width: 480px; border-radius: 18px 18px 0 0;
    padding: 18px; max-height: 80vh; overflow-y: auto;
  }
  #friendsPanel h2 { margin: 0 0 6px; font-size: 17px; }
  #friendsPanel .stats { color: var(--text-dim); font-size: 13px; margin-bottom: 14px; }
  #friendSearchRow { display: flex; gap: 8px; margin-bottom: 14px; }
  #friendSearchRow input {
    flex: 1; padding: 10px 12px; border-radius: 16px; border: none; background: #222; color: #fff; outline: none;
  }
  #friendSearchRow button {
    padding: 10px 14px; border-radius: 16px; border: none; background: var(--accent); color: #fff; font-weight: 600; font-size: 13px;
  }
  .friend-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 0; border-bottom: 1px solid #222; font-size: 14px;
  }
  .friend-row button {
    padding: 6px 12px; border-radius: 14px; border: none; font-size: 12px; font-weight: 600;
  }
  .btn-follow { background: var(--accent); color: #fff; }
  .btn-unfollow { background: #333; color: #fff; }
  #closeFriends {
    display: block; margin: 6px auto 0; background: transparent; color: var(--text-dim);
    border: none; font-size: 13px;
  }
  #searchResult { font-size: 13px; color: #ff5c5c; min-height: 16px; }

  /* ---------- Modal Upload ---------- */
  #uploadOverlay {
    display: none; position: fixed; inset: 0; z-index: 50;
    background: rgba(0,0,0,.75); align-items: flex-end; justify-content: center;
  }
  #uploadPanel {
    background: #141414; width: 100%; max-width: 480px; border-radius: 18px 18px 0 0;
    padding: 18px;
  }
  #uploadPanel h2 { margin: 0 0 6px; font-size: 17px; }
  #uploadPanel p.hint { color: var(--text-dim); font-size: 12px; margin: 0 0 14px; }
  #uploadPanel input[type="file"] {
    width: 100%; color: var(--text-dim); font-size: 13px; margin-bottom: 10px;
  }
  #uploadPanel input[type="text"] {
    width: 100%; padding: 10px 12px; border-radius: 12px; border: none;
    background: #222; color: #fff; outline: none; margin-bottom: 12px; font-size: 14px;
  }
  #uploadPanel button.submit {
    width: 100%; padding: 12px; border-radius: 16px; border: none;
    background: var(--accent); color: #fff; font-weight: 700; font-size: 14px;
  }
  #uploadStatus { font-size: 13px; margin: 10px 0; min-height: 16px; }
  #closeUpload {
    display: block; margin: 10px auto 0; background: transparent; color: var(--text-dim);
    border: none; font-size: 13px;
  }
</style>
</head>
<body>

<!-- 3D LOADING -->
<div id="loading3d">
  <div class="cube-stage">
    <div class="cube">
      <div class="face-front"></div>
      <div class="face-back"></div>
      <div class="face-right"></div>
      <div class="face-left"></div>
      <div class="face-top"></div>
      <div class="face-bottom"></div>
    </div>
  </div>
  <p id="loadingText">Menyiapkan...</p>
</div>

<!-- LOGIN -->
<div id="login" style="display:none;">
  <div class="logo">🎬</div>
  <h1>Selamat datang di VidFeed</h1>
  <p>Masukin nama kamu buat mulai nonton video lucu &amp; viral</p>
  <input id="nameInput" type="text" placeholder="Nama kamu..." />
  <button id="loginBtn">Masuk</button>
  <div id="loginError"></div>
</div>

<!-- BANNED -->
<div id="banned">
  <div class="icon">🚫</div>
  <h1 id="bannedTitle">Akun Diblokir</h1>
  <p id="bannedDesc"></p>
</div>

<!-- APP -->
<div id="app">
  <div id="topbar">
    <div class="greet" id="greetText"></div>
    <div class="topbtns">
      <button id="feedToggleBtn">🎬 Komunitas</button>
      <button id="uploadBtn">📤 Upload</button>
      <button id="friendsBtn">👥 Teman</button>
      <button id="refreshBtn">🔄 Kata kunci lain</button>
    </div>
  </div>
  <div id="feed"></div>
</div>

<!-- MODAL UPLOAD -->
<div id="uploadOverlay">
  <div id="uploadPanel">
    <h2>📤 Upload Video</h2>
    <p class="hint">Video pendek, maksimal sekitar 4MB. Nanti kelihatan sama pengguna lain di tab Komunitas.</p>
    <input id="videoFile" type="file" accept="video/*" />
    <input id="captionInput" type="text" placeholder="Tulis caption (opsional)..." />
    <div id="uploadStatus"></div>
    <button class="submit" id="submitUploadBtn">Upload</button>
    <button id="closeUpload">Tutup</button>
  </div>
</div>

<!-- MODAL TEMAN -->
<div id="friendsOverlay">
  <div id="friendsPanel">
    <h2>👥 Teman</h2>
    <div class="stats" id="friendStats">Following: 0 · Followers: 0</div>
    <div id="friendSearchRow">
      <input id="friendSearchInput" type="text" placeholder="Cari nama user..." />
      <button id="friendSearchBtn">Cari</button>
    </div>
    <div id="searchResult"></div>
    <div id="followingList"></div>
    <button id="closeFriends">Tutup</button>
  </div>
</div>

<script>
const loading3d = document.getElementById('loading3d');
const loadingText = document.getElementById('loadingText');
const loginScreen = document.getElementById('login');
const bannedScreen = document.getElementById('banned');
const app = document.getElementById('app');
const nameInput = document.getElementById('nameInput');
const loginBtn = document.getElementById('loginBtn');
const loginError = document.getElementById('loginError');
const greetText = document.getElementById('greetText');
const feed = document.getElementById('feed');
const refreshBtn = document.getElementById('refreshBtn');
const friendsBtn = document.getElementById('friendsBtn');
const friendsOverlay = document.getElementById('friendsOverlay');
const closeFriends = document.getElementById('closeFriends');
const friendStats = document.getElementById('friendStats');
const friendSearchInput = document.getElementById('friendSearchInput');
const friendSearchBtn = document.getElementById('friendSearchBtn');
const searchResult = document.getElementById('searchResult');
const followingList = document.getElementById('followingList');
const feedToggleBtn = document.getElementById('feedToggleBtn');
const uploadBtn = document.getElementById('uploadBtn');
const uploadOverlay = document.getElementById('uploadOverlay');
const closeUpload = document.getElementById('closeUpload');
const videoFile = document.getElementById('videoFile');
const captionInput = document.getElementById('captionInput');
const submitUploadBtn = document.getElementById('submitUploadBtn');
const uploadStatus = document.getElementById('uploadStatus');

let feedMode = 'trending'; // 'trending' | 'community'

const NAME_KEY = 'vidfeed_username';
const KEYWORDS = ["lucu", "viral", "fyp", "kocak", "receh"];
let currentUsername = '';

function showOnly(el) {
  [loginScreen, bannedScreen, app, loading3d].forEach(e => e.style.display = 'none');
  el.style.display = el === app ? 'block' : 'flex';
}

async function checkAndLogin(name) {
  showOnly(loading3d);
  loadingText.textContent = 'Memeriksa akun...';
  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: name })
    });
    const data = await res.json();

    if (data.banned) {
      document.getElementById('bannedDesc').textContent =
        data.type === 'permanent'
          ? 'Akun kamu diblokir permanen oleh admin karena melanggar aturan.'
          : `Akun kamu diblokir sementara sampai ${new Date(data.until).toLocaleString('id-ID')}.`;
      showOnly(bannedScreen);
      return;
    }

    localStorage.setItem(NAME_KEY, name);
    currentUsername = name;
    greetText.textContent = `Halo, ${name} 👋`;
    showOnly(app);
    loadFeed();
  } catch (err) {
    loginError.textContent = 'Gagal konek ke server, coba lagi.';
    showOnly(loginScreen);
  }
}

loginBtn.addEventListener('click', () => {
  const name = nameInput.value.trim();
  if (!name) return;
  loginError.textContent = '';
  checkAndLogin(name);
});
nameInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') loginBtn.click(); });
refreshBtn.addEventListener('click', loadTrending);

feedToggleBtn.addEventListener('click', () => {
  if (feedMode === 'trending') {
    feedMode = 'community';
    feedToggleBtn.textContent = '🔥 Trending';
    refreshBtn.style.display = 'none';
    loadCommunityFeed();
  } else {
    feedMode = 'trending';
    feedToggleBtn.textContent = '🎬 Komunitas';
    refreshBtn.style.display = 'inline-block';
    loadTrending();
  }
});

function loadFeed() {
  if (feedMode === 'community') loadCommunityFeed();
  else loadTrending();
}

const observer = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    const video = entry.target;
    if (entry.isIntersecting) { video.currentTime = 0; video.play().catch(() => {}); }
    else { video.pause(); }
  });
}, { threshold: 0.6 });

async function loadTrending() {
  const keyword = KEYWORDS[Math.floor(Math.random() * KEYWORDS.length)];
  feed.innerHTML = `<div class="status">Lagi ambil video "${keyword}" buat kamu...</div>`;
  try {
    const res = await fetch('/api/trending?keyword=' + encodeURIComponent(keyword));
    const data = await res.json();
    if (!res.ok || !data.videos || data.videos.length === 0) {
      feed.innerHTML = `<div class="status">⚠️ Gagal ambil video. Coba tekan "Kata kunci lain" di atas.</div>`;
      return;
    }
    feed.innerHTML = '';
    data.videos.forEach(v => {
      const item = document.createElement('div');
      item.className = 'item';
      item.innerHTML = `
        <video src="${v.videoUrl}" loop muted playsinline preload="metadata"></video>
        <div class="meta">
          <div class="author">@${v.author || 'unknown'}</div>
          <div class="title">${v.title || ''}</div>
        </div>`;
      feed.appendChild(item);
      observer.observe(item.querySelector('video'));
    });
  } catch (err) {
    feed.innerHTML = `<div class="status">⚠️ Terjadi kesalahan. Coba lagi sebentar.</div>`;
  }
}

async function loadCommunityFeed() {
  feed.innerHTML = `<div class="status">Memuat video dari komunitas...</div>`;
  try {
    const res = await fetch('/api/list-uploads');
    const data = await res.json();
    if (!res.ok || !data.uploads || data.uploads.length === 0) {
      feed.innerHTML = `<div class="status">Belum ada video upload dari user. Jadi yang pertama upload! 📤</div>`;
      return;
    }
    feed.innerHTML = '';
    data.uploads.forEach(u => {
      const item = document.createElement('div');
      item.className = 'item';
      item.innerHTML = `
        <video src="/api/get-upload?id=${u.id}" loop muted playsinline preload="metadata"></video>
        <div class="meta">
          <div class="author">@${u.username}</div>
          <div class="title">${u.caption || ''}</div>
        </div>`;
      feed.appendChild(item);
      observer.observe(item.querySelector('video'));
    });
  } catch (err) {
    feed.innerHTML = `<div class="status">⚠️ Terjadi kesalahan. Coba lagi sebentar.</div>`;
  }
}

// ---------- Fitur Upload ----------
function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(',')[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

uploadBtn.addEventListener('click', () => {
  uploadOverlay.style.display = 'flex';
  uploadStatus.textContent = '';
});
closeUpload.addEventListener('click', () => { uploadOverlay.style.display = 'none'; });

submitUploadBtn.addEventListener('click', async () => {
  const file = videoFile.files[0];
  if (!file) { uploadStatus.textContent = 'Pilih video dulu ya.'; uploadStatus.style.color = '#ff5c5c'; return; }
  if (file.size > 4.5 * 1024 * 1024) {
    uploadStatus.textContent = 'Video terlalu besar (maks ~4MB). Pakai video pendek/kualitas rendah.';
    uploadStatus.style.color = '#ff5c5c';
    return;
  }

  uploadStatus.textContent = 'Mengupload...';
  uploadStatus.style.color = 'var(--text-dim)';
  submitUploadBtn.disabled = true;

  try {
    const base64 = await fileToBase64(file);
    const res = await fetch('/api/upload-video', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        username: currentUsername,
        caption: captionInput.value.trim(),
        videoBase64: base64,
        mimeType: file.type || 'video/mp4',
      }),
    });
    const data = await res.json();
    if (!res.ok) {
      uploadStatus.textContent = data.error || 'Gagal upload.';
      uploadStatus.style.color = '#ff5c5c';
    } else {
      uploadStatus.textContent = 'Berhasil diupload! 🎉';
      uploadStatus.style.color = '#4caf50';
      videoFile.value = '';
      captionInput.value = '';
      setTimeout(() => { uploadOverlay.style.display = 'none'; }, 1200);
    }
  } catch (err) {
    uploadStatus.textContent = 'Terjadi kesalahan saat upload.';
    uploadStatus.style.color = '#ff5c5c';
  } finally {
    submitUploadBtn.disabled = false;
  }
});

// ---------- Fitur Teman (follow) ----------
async function loadFriendsPanel() {
  const res = await fetch('/api/follow?username=' + encodeURIComponent(currentUsername));
  const data = await res.json();
  friendStats.textContent = `Following: ${data.following.length} · Followers: ${data.followers.length}`;

  followingList.innerHTML = data.following.length
    ? data.following.map(u => `
        <div class="friend-row">
          <span>${u}</span>
          <button class="btn-unfollow" onclick="toggleFollow('${u}','unfollow')">Berhenti</button>
        </div>`).join('')
    : `<div class="friend-row" style="color:var(--text-dim);border:none;">Belum follow siapa-siapa.</div>`;
}

async function toggleFollow(target, action) {
  await fetch('/api/follow', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ username: currentUsername, target, action })
  });
  searchResult.textContent = '';
  loadFriendsPanel();
}

friendsBtn.addEventListener('click', () => {
  friendsOverlay.style.display = 'flex';
  loadFriendsPanel();
});
closeFriends.addEventListener('click', () => { friendsOverlay.style.display = 'none'; });

friendSearchBtn.addEventListener('click', async () => {
  const target = friendSearchInput.value.trim().toLowerCase();
  searchResult.textContent = '';
  if (!target) return;
  if (target === currentUsername.toLowerCase()) {
    searchResult.textContent = 'Nggak bisa follow diri sendiri ya.';
    return;
  }
  const res = await fetch('/api/follow?username=' + encodeURIComponent(currentUsername));
  const data = await res.json();
  const isFollowing = data.following.includes(target);
  searchResult.innerHTML = '';
  const row = document.createElement('div');
  row.className = 'friend-row';
  row.innerHTML = `
    <span>${target}</span>
    <button class="${isFollowing ? 'btn-unfollow' : 'btn-follow'}">
      ${isFollowing ? 'Berhenti' : 'Follow'}
    </button>`;
  row.querySelector('button').addEventListener('click', () => {
    toggleFollow(target, isFollowing ? 'unfollow' : 'follow');
  });
  searchResult.appendChild(row);
});

// Boot
window.addEventListener('load', () => {
  const savedName = localStorage.getItem(NAME_KEY);
  setTimeout(() => {
    if (savedName) {
      checkAndLogin(savedName);
    } else {
      showOnly(loginScreen);
    }
  }, 900); // kasih jeda dikit biar loading 3D kelihatan
});
</script>

</body>
</html>
